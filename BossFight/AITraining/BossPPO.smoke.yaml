behaviors:
  AdaptiveBoss:
    trainer_type: ppo
    hyperparameters:
      batch_size: 64
      buffer_size: 256
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 64
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    time_horizon: 64
    max_steps: 2000
    summary_freq: 100
    keep_checkpoints: 1
    checkpoint_interval: 1000
    threaded: false

torch_settings:
  device: cpu
