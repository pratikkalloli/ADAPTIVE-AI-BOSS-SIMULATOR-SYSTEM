behaviors:
  AdaptiveBoss:
    trainer_type: ppo
    hyperparameters:
      batch_size: 64
      buffer_size: 1024
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    time_horizon: 64
    max_steps: 2000000
    summary_freq: 10000
    keep_checkpoints: 4
    checkpoint_interval: 50000
    threaded: true

torch_settings:
  device: cpu
